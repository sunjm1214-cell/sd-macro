[project]
name = "druck-macro"
version = "0.1.0"
description = "SD macro rules as runnable data tools"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
sectors = ["yfinance>=0.2"]
test = ["pytest"]

[project.scripts]
druck = "druck.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["druck*"]
