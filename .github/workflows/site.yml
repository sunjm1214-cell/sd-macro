# 사이트 자동 갱신: 매일 아침(한국시간 7:10)과 코드·컨콜 정리본이 바뀔 때마다
# 최신 FRED/Yahoo 데이터로 리포트를 다시 만들어 GitHub Pages에 올린다.
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 22 * * *"   # UTC 22:10 = 한국시간 07:10
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: 테스트 (실패하면 사이트를 바꾸지 않는다)
        run: python -m pytest -q
      - uses: actions/cache@v4
        with:
          path: ~/.druck_cache
          key: druck-${{ github.run_id }}
          restore-keys: druck-
      - name: 리포트 생성
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 없어도 됨 (공개 CSV로 받음)
        run: |
          mkdir -p site
          python -m druck run --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
